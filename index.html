<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Racetrack</title><style>*{box-sizing:border-box}body{margin:0;background:#15202b;color:#fff;font:16px system-ui;text-align:center}header{padding:12px}h1{margin:0;font-size:24px}p{margin:7px 0}canvas{display:block;margin:auto;touch-action:none;background:#f7f7ed;max-width:100vw;border:2px solid #5c6874}button{font-size:17px;padding:10px 18px;border:0;border-radius:9px;background:#f4cb42;margin:10px}small{display:block;padding:0 12px 12px;color:#d5dde5}</style></head><body><header><h1>🏎️ Racetrack</h1><p id="status">Mosse: 0 · Velocità: 0</p></header><canvas id="game"></canvas><button id="reset">Ricomincia</button><small>Trascina dalla pallina rossa verso una casella evidenziata, poi rilascia. Ogni mossa varia di massimo 1 casella; velocità massima 5. Non attraversare i bordi!</small><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status');const W=22,H=29,S=17;c.width=W*S;c.height=H*S;let pos,speed,moves,trail,finished,drag=null;const outer={x:1.5,y:1.5,w:19,h:26},inner={x:6.5,y:6.5,w:9,h:16};const start={x:4,y:23};function inside(x,y){return x>outer.x&&x<outer.x+outer.w&&y>outer.y&&y<outer.y+outer.h&&!(x>inner.x&&x<inner.x+inner.w&&y>inner.y&&y<inner.y+inner.h)}function segmentOK(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*12);for(let i=0;i<=n;i++){let t=i/n;if(!inside(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false}return true}function candidates(){let arr=[];for(let dx=-5;dx<=5;dx++)for(let dy=-5;dy<=5;dy++){let d=Math.hypot(dx,dy);if(d<0.99||d>5.01||Math.abs(d-speed)>1.01)continue;let p={x:pos.x+dx,y:pos.y+dy};if(inside(p.x,p.y)&&segmentOK(pos,p))arr.push({...p,d})}return arr}function draw(){ctx.fillStyle='#f7f7ed';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#d9e2e6';ctx.lineWidth=.6;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke()}ctx.strokeStyle='#202b33';ctx.lineWidth=4;ctx.strokeRect(outer.x*S,outer.y*S,outer.w*S,outer.h*S);ctx.strokeRect(inner.x*S,inner.y*S,inner.w*S,inner.h*S);ctx.strokeStyle='#f59e0b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(outer.x*S,23*S);ctx.lineTo(inner.x*S,23*S);ctx.stroke();if(!finished){ctx.fillStyle='rgba(25,145,85,.25)';for(const p of candidates()){ctx.beginPath();ctx.arc(p.x*S,p.y*S,5,0,Math.PI*2);ctx.fill()}}ctx.strokeStyle='#db3434';ctx.lineWidth=2.5;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x*S,p.y*S):ctx.moveTo(p.x*S,p.y*S));ctx.stroke();if(drag){ctx.strokeStyle='#3998e6';ctx.beginPath();ctx.moveTo(pos.x*S,pos.y*S);ctx.lineTo(drag.x*S,drag.y*S);ctx.stroke()}ctx.fillStyle='#e11d48';ctx.beginPath();ctx.arc(pos.x*S,pos.y*S,7,0,Math.PI*2);ctx.fill();status.textContent=`Mosse: ${moves} · Velocità: ${speed.toFixed(1)}${finished?' · 🏁 Traguardo!':''}`}
function reset(){pos={...start};speed=0;moves=0;trail=[{...pos}];finished=false;drag=null;draw()}function pointer(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width/S,y:(e.clientY-r.top)*c.height/r.height/S}}c.addEventListener('pointerdown',e=>{if(finished)return;c.setPointerCapture(e.pointerId);drag=pointer(e);draw()});c.addEventListener('pointermove',e=>{if(drag){drag=pointer(e);draw()}});c.addEventListener('pointerup',e=>{if(!drag||finished)return;let p=pointer(e),choices=candidates();choices.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));if(choices.length&&Math.hypot(choices[0].x-p.x,choices[0].y-p.y)<1.35){let old={...pos},next=choices[0];pos={x:next.x,y:next.y};speed=next.d;moves++;trail.push({...pos});if(old.y>23&&pos.y<=23&&pos.x<inner.x&&moves>3){finished=true;setTimeout(()=>alert('🏁 Traguardo in '+moves+' mosse!'),100)}}drag=null;draw()});document.getElementById('reset').onclick=reset;reset();})();
</script></body></html>
